
services:
  # Servidor PHP-FPM (Laravel 13)
  freya-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: freya-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: freya-app
      SERVICE_TAGS: dev
    volumes:
      - .:/var/www
    networks:
      - freya-network

  # Servidor Web Nginx
  freya-nginx:
    image: nginx:alpine
    container_name: freya-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - freya-network
    depends_on:
      - freya-app

  # Banco de Dados MySQL
  freya-db:
    image: mysql:8.0
    container_name: freya-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-freya_cosmetics}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-sail}
    volumes:
      - freya-db-data:/var/lib/mysql
    networks:
      - freya-network

  # Cache e Gerenciador de Filas Redis
  freya-redis:
    image: redis:alpine
    container_name: freya-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - freya-redis-data:/data
    networks:
      - freya-network

networks:
  freya-network:
    driver: bridge

volumes:
  freya-db-data:
    driver: local
  freya-redis-data:
    driver: local
